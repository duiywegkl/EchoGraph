<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoGraph Knowledge Graph</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <link rel="stylesheet" href="assets/css/graph/graph-visualization.css">
</head>
<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>正在加载图谱...</p>
    </div>
    
    <div class="controls" id="controls">
        <button onclick="togglePhysics()">关闭物理效果</button>
        <span title="关系编辑尚未连接到持久化存储"><button onclick="toggleEditMode()" id="editModeBtn" disabled>编辑关系</button></span>
        <button onclick="toggleForcePanel()" id="forcePanelBtn">调节力度</button>
        <button onclick="refreshGraphFromHost()">刷新图谱</button>
    </div>
    
    <!-- 力度调节面板 -->
    <div class="force-panel" id="forcePanel" style="display: none;">
        <h4>物理参数调节</h4>
        <div class="force-control">
            <label>排斥力度:</label>
            <input type="range" id="repulsionSlider" min="-1500" max="-20" step="20" value="-400">
            <span id="repulsionValue">-400</span>
        </div>
        <div class="force-control">
            <label>连线长度:</label>
            <input type="range" id="linkDistanceSlider" min="60" max="250" step="10" value="120">
            <span id="linkDistanceValue">120</span>
        </div>
        <div class="force-control">
            <label>碰撞半径:</label>
            <input type="range" id="collisionSlider" min="20" max="80" step="2" value="40">
            <span id="collisionValue">40</span>
        </div>
        <div class="force-control">
            <label>中心引力:</label>
            <input type="range" id="centerStrengthSlider" min="0" max="0.3" step="0.01" value="0">
            <span id="centerStrengthValue">0</span>
        </div>
        <div class="force-control">
            <button onclick="resetToSmart()">智能参数</button>
            <button onclick="applyForceChanges()">应用设置</button>
        </div>
    </div>
    
    <div class="graph-container" id="graphContainer">
        <svg id="graph" width="100%" height="100%"></svg>
    </div>
    
    <div class="tooltip" id="tooltip"></div>
    <div class="legend"><span><i style="--dot:var(--character)"></i>角色</span><span><i style="--dot:var(--location)"></i>地点</span><span><i style="--dot:var(--item)"></i>物品</span><span><i style="--dot:var(--event)"></i>事件</span><span><i style="--dot:var(--concept)"></i>概念</span></div>
    
    <div id="fallback" class="fallback">
        <h2>知识图谱 - 简化视图</h2>
        <div class="entity-grid" id="entityGrid">
            <!-- 实体卡片将通过JavaScript动态生成 -->
        </div>
        <p style="opacity: 0.7; font-size: 14px; margin-top: 20px;">
            网络访问受限，无法加载D3.js库，显示简化版本<br>
            <small>已尝试从CDN和本地文件加载D3.js</small><br>
            <small>本地文件路径: ./assets/js/d3.v7.min.js</small>
        </p>
        <button onclick="location.reload()">重新加载</button>
    </div>
    
    <script>
        // 数据注入点 - 将由Python代码替换，直接赋值给全局变量
        // 注意：不要重新声明，因为变量已在graph-core.js中声明
        window.graphNodes = {{NODES_DATA}};
        window.graphLinks = {{LINKS_DATA}};
        
        console.log('页面加载开始');
        console.log('节点数据:', window.graphNodes);
        console.log('连接数据:', window.graphLinks);
    </script>
    
    <!-- 核心JavaScript -->
    <script src="assets/js/graph/graph-core.js"></script>
</body>
</html>
